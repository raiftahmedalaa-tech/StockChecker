<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص الأصناف والألوان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#f3f5f4; --card:#ffffff; --ink:#14231f; --muted:#5b6b66; --line:#d9e0dd;
  --brand:#0d5c52; --brand-d:#09443d; --brand-soft:#e3f1ee;
  --ok:#15803d; --ok-soft:#e6f4ea;
  --err:#b42318; --err-soft:#fdecea;
  --warn:#a15c07; --warn-soft:#fdf3e1;
  --info:#1d4f91; --info-soft:#e8f0fb;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.7;font-size:16px}
.wrap{max-width:860px;margin:0 auto;padding:40px 20px 80px}
header{margin-bottom:24px}
h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.25;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);max-width:60ch}

.sheet{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:12px;padding:12px 16px;margin-bottom:18px;
  background:var(--info-soft);color:var(--info);font-weight:500}
.sheet.ok{background:var(--ok-soft);color:var(--ok)}
.sheet.bad{background:var(--err-soft);color:var(--err)}
.sheet .txt{flex:1;min-width:200px}
.sheet small{display:block;font-weight:400;color:var(--muted)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:currentColor}
.sheet.load .dot{animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}

.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}
.step-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-weight:600;font-size:.95rem}
.step.done .num{background:var(--ok)}
.step-head h2{margin:0;font-size:1.15rem;font-weight:600}
.need{margin:0 0 14px;color:var(--muted);font-size:.92rem}
.chips{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle}
.chip{background:var(--brand-soft);color:var(--brand-d);padding:1px 10px;border-radius:6px;font-size:.88rem;font-weight:500;direction:ltr;unicode-bidi:isolate}

.drop{display:block;border:2px dashed #b4c3be;border-radius:12px;padding:26px 16px;text-align:center;cursor:pointer;
  background:#fafbfb;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{background:var(--brand-soft);border-color:var(--brand)}
.drop:focus-within{outline:3px solid var(--brand);outline-offset:2px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop strong{display:block;font-weight:600}
.drop span{color:var(--muted);font-size:.9rem}
.drop svg{width:34px;height:34px;color:var(--brand);margin-bottom:6px}

.file{display:none;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #b9dcc4;background:var(--ok-soft);
  border-radius:12px;padding:12px 14px}
.file.show{display:flex}
.file .ico{color:var(--ok);flex:none}
.file .meta{flex:1;min-width:150px}
.file .meta b{display:block;font-weight:600;word-break:break-all;direction:ltr;text-align:right}
.file .meta small{color:var(--muted)}
.link{background:none;border:0;color:var(--brand);font:inherit;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:6px}
.link:hover{background:var(--brand-soft)}
.link:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.msg{display:none;margin-top:12px;border-radius:10px;padding:11px 14px;background:var(--err-soft);color:var(--err);font-weight:500}
.msg.show{display:block}
.msg code{direction:ltr;unicode-bidi:isolate;background:#fff;padding:0 6px;border-radius:4px}

.actions{display:none;margin:26px 0;text-align:center}
.actions.show{display:block}
.btn{font:inherit;font-weight:700;font-size:1.1rem;background:var(--brand);color:#fff;border:0;border-radius:12px;
  padding:14px 56px;cursor:pointer;box-shadow:0 2px 0 var(--brand-d);transition:background .15s,transform .05s}
.btn:hover{background:var(--brand-d)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn:disabled{opacity:.6;cursor:wait}

#results{display:none}
#results.show{display:block}
.summary{border-radius:14px;padding:18px 20px;margin-bottom:16px;font-weight:600;font-size:1.05rem;display:flex;gap:12px;align-items:center}
.summary.good{background:var(--ok-soft);color:var(--ok)}
.summary.bad{background:#fff;border:1px solid var(--line);color:var(--ink)}
.summary small{display:block;font-weight:400;color:var(--muted)}

details.alert{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;border-inline-start:6px solid var(--c)}
details.alert.a1{--c:var(--warn)}
details.alert.a2{--c:var(--info)}
details.alert.a3{--c:var(--err)}
details.alert.clean{--c:var(--ok)}
summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:12px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary .t{flex:1}
.count{min-width:34px;text-align:center;padding:1px 10px;border-radius:999px;font-size:.9rem;
  background:var(--c);color:#fff}
.alert.clean .count{background:var(--ok)}
summary::after{content:"";width:9px;height:9px;border-inline-end:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(45deg);transition:transform .15s;margin-inline-start:4px}
details[open] summary::after{transform:rotate(-135deg)}
.alert ul{margin:0;padding:0 18px 14px;list-style:none;max-height:460px;overflow:auto}
.alert li{padding:10px 0;border-top:1px solid var(--line);font-size:.97rem}
.alert li:first-child{border-top:0}
.v{direction:ltr;unicode-bidi:isolate;display:inline-block;background:#eef2f1;border-radius:5px;padding:0 7px;font-weight:600}
.v.bad{background:var(--err-soft);color:var(--err)}
.v.good{background:var(--ok-soft);color:var(--ok)}
.rows{color:var(--muted)}
.none{padding:0 18px 14px;color:var(--muted);margin:0}
@media (max-width:520px){.btn{width:100%;padding:14px}.step{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>فحص الأصناف والألوان</h1>
    <p>ارفع الملف المراد اختباره فقط. تتم المقارنة مباشرة مع شيت الأصناف المعتمدة على Google Sheets، وبأحدث نسخة منه وقت الضغط على فحص.</p>
  </header>

  <div class="sheet load" id="sheetBox" role="status" aria-live="polite">
    <span class="dot"></span>
    <div class="txt" id="sheetTxt">جاري الاتصال بالشيت المعتمد...</div>
    <button type="button" class="link" id="retryBtn" style="display:none">إعادة المحاولة</button>
  </div>

  <section class="step" id="step2">
    <div class="step-head"><div class="num">1</div><h2>برجاء رفع الملف الذي تريد اختباره</h2></div>
    <p class="need">الأعمدة المطلوبة: <span class="chips"><span class="chip">Product Number</span><span class="chip">Color</span><span class="chip">Qty</span></span> أو <span class="chips"><span class="chip">Item</span><span class="chip">Color</span><span class="chip">Qty</span></span></p>
    <label class="drop" id="drop2">
      <input type="file" id="file2" accept=".xlsx,.xls,.xlsm,.csv">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7 9m5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <strong>اضغط لاختيار الملف أو اسحبه هنا</strong>
      <span>Excel ‏(.xlsx / .xls) أو CSV</span>
    </label>
    <div class="file" id="info2"></div>
    <div class="msg" id="err2" role="alert"></div>
  </section>

  <div class="actions" id="actions"><button class="btn" id="checkBtn" type="button">فحص</button></div>
  <div class="msg" id="errRun" role="alert"></div>

  <section id="results" aria-live="polite"></section>
</div>

<script>
(function(){
  // رابط الشيت المعتمد (يجب أن يكون مشاركاً "أي شخص لديه الرابط - عارض")
  var SHEET_ID = "1icsPetFUSuFYAPqhcLr7_kJ7rjsZ_0sEgNLNs96veJ4";
  var SHEET_GID = "0";
  var REF_COLS = ["اجمالي الكود الصحيح","اجمالي الألوان الصحيحه"];
  var TEST_SETS = [["Product Number","Color","Qty"],["Item","Color","Qty"]];
  var ref = null, test = null, refTime = null;

  function $(id){return document.getElementById(id);}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function normHeader(s){
    return String(s==null?"":s).replace(/[\u064B-\u0652\u0640]/g,"")
      .replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
      .replace(/\s+/g," ").trim().toLowerCase();
  }
  function cell(v){ return v==null ? "" : String(v).trim(); }
  function key(v){ return cell(v).toUpperCase(); }

  function readTable(wb, required){
    var want = required.map(normHeader), firstHeaders = [];
    for(var s=0;s<wb.SheetNames.length;s++){
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[s]],{header:1,defval:"",raw:true});
      for(var i=0;i<Math.min(rows.length,30);i++){
        var heads = rows[i].map(normHeader), idx = want.map(function(w){return heads.indexOf(w);});
        if(s===0 && i===0) firstHeaders = heads;
        if(idx.every(function(x){return x>=0;})){
          return {ok:true, rows:rows, header:i, idx:idx};
        }
      }
    }
    var missing = required.filter(function(c){return firstHeaders.indexOf(normHeader(c))<0;});
    return {ok:false, missing: missing.length?missing:required};
  }

  function tryRead(wb, sets){
    var first = null;
    for(var i=0;i<sets.length;i++){
      var res = readTable(wb, sets[i]);
      if(res.ok) return res;
      if(!first) first = res;
    }
    first.sets = sets;
    return first;
  }

  function toData(res){
    var data = [];
    res.rows.slice(res.header+1).forEach(function(r,i){
      var a = r[res.idx[0]], b = r[res.idx[1]], c = res.idx[2]!==undefined ? r[res.idx[2]] : "";
      if(cell(a)==="" && cell(b)==="" && cell(c)==="") return;
      data.push({row: res.header+2+i, a:cell(a), b:cell(b), c:cell(c)});
    });
    return data;
  }

  // ===== جلب الشيت المعتمد من Google Sheets =====
  function sheetUrls(){
    var t = "&_=" + Date.now();
    return [
      "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&gid="+SHEET_GID+t,
      "https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/export?format=csv&gid="+SHEET_GID+t
    ];
  }
  function fetchText(urls, i){
    return fetch(urls[i], {cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.text();
    }).catch(function(err){
      if(i+1<urls.length) return fetchText(urls, i+1);
      throw err;
    });
  }
  function loadRef(){
    return fetchText(sheetUrls(), 0).then(function(text){
      if(/^\s*<(!doctype|html)/i.test(text)) throw new Error("not-shared");
      var wb = XLSX.read(text, {type:"string", raw:true});
      var res = readTable(wb, REF_COLS);
      if(!res.ok) throw new Error("columns");
      var data = toData(res).map(function(r){ return {row:r.row, a:r.a, b:r.b}; });
      ref = data; refTime = new Date();
      return data;
    });
  }

  function setSheet(state, html, retry){
    var box = $("sheetBox");
    box.className = "sheet " + state;
    $("sheetTxt").innerHTML = html;
    $("retryBtn").style.display = retry ? "" : "none";
  }
  function timeStr(d){
    return d.toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  }
  function connect(){
    setSheet("load","جاري الاتصال بالشيت المعتمد...",false);
    return loadRef().then(function(data){
      setSheet("ok","متصل بالشيت المعتمد<small>"+data.length+" صف · آخر تحديث للقراءة "+timeStr(refTime)+"</small>",false);
      refresh();
    }).catch(function(err){
      ref = null;
      var m = err && err.message;
      var why = m==="not-shared" ? "تأكد أن الشيت مشارَك بصلاحية «أي شخص لديه الرابط – عارض»."
        : m==="columns" ? "الشيت لا يحتوي على الأعمدة <code>اجمالي الكود الصحيح</code> و <code>اجمالي الألوان الصحيحه</code>."
        : "تأكد من الاتصال بالإنترنت وأن الصفحة مفتوحة من متصفح عادي (وليس من داخل معاينة أو نافذة مقيّدة).";
      setSheet("bad","تعذر الاتصال بالشيت المعتمد.<small>"+why+"</small>",true);
      refresh();
    });
  }

  // ===== رفع الملف المراد اختباره =====
  function showError(res){
    var el = $("err2");
    if(res.broken){ el.textContent = "تعذر قراءة الملف. تأكد أنه ملف Excel سليم وحاول مرة أخرى."; }
    else{
      el.innerHTML = "الملف لا يحتوي على الأعمدة المطلوبة. لازم يحتوي على: <code>Product Number</code> أو <code>Item</code> ، و <code>Color</code> ، و <code>Qty</code>. ارفع الملف الصحيح.";
    }
    el.classList.add("show");
  }
  function setInfo(file, count){
    var el = $("info2");
    el.innerHTML = '<svg class="ico" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>'
      + '<div class="meta"><b>'+esc(file.name)+'</b><small>الأعمدة المطلوبة موجودة · '+count+' صف</small></div>'
      + '<button type="button" class="link" data-replace="1">تغيير الملف</button>';
    el.classList.add("show");
    $("drop2").style.display = "none";
    $("step2").classList.add("done");
  }
  function resetStep(){
    $("info2").classList.remove("show"); $("err2").classList.remove("show");
    $("drop2").style.display = ""; $("step2").classList.remove("done");
    $("file2").value = "";
  }
  function refresh(){
    $("actions").classList.toggle("show", !!(ref && test));
    $("results").classList.remove("show");
    $("errRun").classList.remove("show");
  }

  function handle(file){
    if(!file) return;
    $("err2").classList.remove("show");
    var r = new FileReader();
    r.onload = function(e){
      var res;
      try{
        var wb = XLSX.read(new Uint8Array(e.target.result),{type:"array"});
        res = tryRead(wb, TEST_SETS);
      }catch(err){ res = {ok:false, broken:true}; }
      if(!res.ok){
        test = null;
        $("info2").classList.remove("show"); $("step2").classList.remove("done"); $("drop2").style.display="";
        showError(res); refresh(); return;
      }
      test = toData(res);
      setInfo(file, test.length); refresh();
    };
    r.onerror = function(){ showError({broken:true}); };
    r.readAsArrayBuffer(file);
  }

  var drop = $("drop2"), input = $("file2");
  input.addEventListener("change", function(){ handle(input.files[0]); });
  ["dragenter","dragover"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("over");});});
  ["dragleave","drop"].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove("over");});});
  drop.addEventListener("drop", function(e){ if(e.dataTransfer.files[0]) handle(e.dataTransfer.files[0]); });
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-replace]"); if(!b) return;
    test = null; resetStep(); refresh();
  });
  $("retryBtn").addEventListener("click", connect);

  // ===== التحليل =====
  function rowsText(list){
    return list.length===1 ? "الصف "+list[0] : "الصفوف "+list.join("، ");
  }
  function analyze(){
    var good = {}, goodDisplay = {};
    ref.forEach(function(r){
      var p = key(r.a); if(!p) return;
      if(!good[p]){ good[p] = {}; goodDisplay[p] = {name:r.a, colors:[]}; }
      var c = key(r.b);
      if(!good[p][c]){ good[p][c] = true; goodDisplay[p].colors.push(r.b===""?"(فارغ)":r.b); }
    });
    var pcMap = {}, pcqMap = {}, missing = [];
    test.forEach(function(r){
      var p = key(r.a), c = key(r.b), q = key(r.c);
      var k1 = p+"\u0001"+c, k2 = k1+"\u0001"+q;
      (pcMap[k1] = pcMap[k1] || {p:r.a||"(فارغ)", c:r.b||"(فارغ)", rows:[]}).rows.push(r.row);
      (pcqMap[k2] = pcqMap[k2] || {p:r.a||"(فارغ)", c:r.b||"(فارغ)", q:r.c===""?"(فارغ)":r.c, rows:[]}).rows.push(r.row);
      if(!good[p]){
        missing.push({row:r.row, p:r.a||"(فارغ)", c:r.b||"(فارغ)", unknown:true});
      } else if(!good[p][c]){
        missing.push({row:r.row, p:r.a||"(فارغ)", c:r.b||"(فارغ)", allowed:goodDisplay[p].colors});
      }
    });
    function dups(m){ return Object.keys(m).map(function(k){return m[k];}).filter(function(x){return x.rows.length>1;}); }
    return {d1:dups(pcMap), d2:dups(pcqMap), miss:missing};
  }

  function v(t,cls){ return '<span class="v '+(cls||"")+'">'+esc(t)+'</span>'; }
  function section(cls, title, items){
    if(!items.length){
      return '<details class="alert clean"><summary><span class="t">'+title+'</span><span class="count">0</span></summary><p class="none">لا توجد ملاحظات.</p></details>';
    }
    return '<details class="alert '+cls+'" open><summary><span class="t">'+title+'</span><span class="count">'+items.length+'</span></summary><ul>'
      + items.join("") + '</ul></details>';
  }

  function render(a){
    var total = a.d1.length + a.d2.length + a.miss.length;
    var note = 'تمت المقارنة مع الشيت المعتمد ('+ref.length+' صف) وقت '+timeStr(refTime);
    var html = total===0
      ? '<div class="summary good"><div>الملف سليم. لا توجد تكرارات، وكل الألوان موجودة في الشيت المعتمد.<small>'+note+'</small></div></div>'
      : '<div class="summary bad"><div>تم العثور على ملاحظات تحتاج مراجعة<small>تم فحص '+test.length+' صف من الملف المختبَر · '+note+'</small></div></div>';

    html += section("a1","تكرار في Product Number و Color", a.d1.map(function(x){
      return '<li>فيه تكرار في Product Number '+v(x.p)+' و Color '+v(x.c)+' <span class="rows">في '+rowsText(x.rows)+'</span></li>';
    }));
    html += section("a2","تكرار في Product Number و Color و Qty", a.d2.map(function(x){
      return '<li>فيه تكرار في Product Number '+v(x.p)+' و Color '+v(x.c)+' و Qty '+v(x.q)+' <span class="rows">في '+rowsText(x.rows)+'</span></li>';
    }));
    html += section("a3","ألوان غير موجودة في الشيت الصحيح", a.miss.map(function(x){
      if(x.unknown){
        return '<li>البرودكت '+v(x.p,"bad")+' <span class="rows">(الصف '+x.row+')</span> موجود في الشيت الذي تريد اختباره ولا يوجد في الشيت الصحيح نهائياً.</li>';
      }
      return '<li>اللون '+v(x.c,"bad")+' التابع للبرودكت '+v(x.p)+' <span class="rows">(الصف '+x.row+')</span> موجود في الشيت الذي تريد اختباره ولا يوجد في الشيت الصحيح، حيث إن الألوان الموجودة في الشيت الصحيح لهذا البرودكت هي: '
        + x.allowed.map(function(c){return v(c,"good");}).join(" ") + '</li>';
    }));

    var box = $("results"); box.innerHTML = html; box.classList.add("show");
    box.scrollIntoView({behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  }

  // عند الضغط على فحص: نجلب أحدث نسخة من الشيت أولاً ثم نقارن
  $("checkBtn").addEventListener("click", function(){
    var btn = this; btn.disabled = true; $("errRun").classList.remove("show");
    setSheet("load","جاري تحميل أحدث نسخة من الشيت المعتمد...",false);
    loadRef().then(function(data){
      setSheet("ok","متصل بالشيت المعتمد<small>"+data.length+" صف · آخر تحديث للقراءة "+timeStr(refTime)+"</small>",false);
      render(analyze());
    }).catch(function(){
      var el = $("errRun");
      el.textContent = "تعذر تحميل أحدث نسخة من الشيت المعتمد، لذلك لم يتم الفحص. تحقق من الاتصال وحاول مرة أخرى.";
      el.classList.add("show");
      setSheet("bad","تعذر الاتصال بالشيت المعتمد.",true);
    }).then(function(){ btn.disabled = false; });
  });

  connect();
})();
</script>
</body>
</html>
