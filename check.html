<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فحص ملف الإكسل</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--bg:#f3f6fb;--text:#172033;--muted:#64748b;--border:#e2e8f0;--ok:#15803d;--err:#b91c1c;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
.page{max-width:760px;margin:0 auto;padding:24px 14px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:14px;box-shadow:0 12px 35px rgba(15,23,42,.06)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:23px;margin:0}
h2{font-size:18px;margin:0 0 10px}
.hint{color:var(--muted);font-size:13px;line-height:1.9;margin:0 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;direction:ltr;justify-content:flex-end;margin-bottom:12px}
.chip{font-family:Arial,sans-serif;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:#eff6ff;color:var(--primary-dark);border:1px solid #bfdbfe}
button{min-height:48px;border:0;border-radius:12px;background:var(--primary);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:12px 16px}
button:hover{background:var(--primary-dark)}
button:disabled{opacity:.55;cursor:not-allowed}
button.full{width:100%}
button.secondary{background:#fff;color:var(--primary);border:1px solid #bfdbfe;min-height:42px;padding:8px 16px;font-size:14px}
button.secondary:hover{background:#eff6ff}
input[type=password]{width:100%;min-height:48px;border:1px solid #cbd5e1;border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;margin-bottom:12px}
.drop{display:block;border:2px dashed #93c5fd;border-radius:14px;padding:34px 16px;text-align:center;cursor:pointer;background:#f8fbff;transition:.15s}
.drop:hover,.drop.over{background:#eff6ff;border-color:var(--primary)}
.drop input{display:none}
.drop strong{display:block;font-size:16px}
.drop span{color:var(--muted);font-size:13px}
.file{display:none;margin-top:12px;padding:10px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;font-size:14px;font-weight:700;direction:ltr;text-align:right;overflow-wrap:anywhere}
.file.show{display:block}
#checkBtn{display:none;margin-top:14px}
#checkBtn.show{display:block}
.message{border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:13px;line-height:1.9;overflow-wrap:anywhere}
.message h3{margin:0 0 4px;font-size:15px}
.message p{margin:0}
.message.error{background:#fef2f2;border:1px solid #fecaca;color:var(--err)}
.message.success{background:#f0fdf4;border:1px solid #bbf7d0;color:var(--ok)}
.message.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1d4ed8}
.message.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.grp{background:#fff;border:1px solid #fde68a;border-radius:10px;margin-top:8px;padding:10px 12px;color:var(--text)}
.grp .h{font-weight:700;color:#92400e;margin-bottom:4px}
.kv{direction:ltr;text-align:right;font-family:Arial,sans-serif;font-size:13px}
.kv b{color:var(--muted);font-weight:700}
.sub{color:var(--muted);font-size:12px;margin-top:2px;direction:ltr;text-align:right;font-family:Arial,sans-serif}
.list{max-height:420px;overflow-y:auto;padding-inline-end:4px}
.hidden{display:none!important}
</style>
</head>
<body>
<main class="page">
  <section id="loginCard" class="card">
    <h1 style="margin-bottom:12px">فحص ملف الإكسل</h1>
    <p class="hint">اكتب كلمة السر لفتح الصفحة.</p>
    <div id="loginMsg" class="message hidden" role="status"></div>
    <form id="loginForm">
      <input id="pw" type="password" autocomplete="off" placeholder="كلمة السر" required>
      <button id="loginBtn" class="full" type="submit">دخول</button>
    </form>
  </section>

  <section id="appCard" class="card hidden">
    <div class="top">
      <h1>فحص ملف الإكسل</h1>
      <button id="tplBtn" class="secondary" type="button">Download template</button>
    </div>
    <div class="chips"><span class="chip">Code</span><span class="chip">Color</span><span class="chip">Qty</span></div>

    <label class="drop" id="drop">
      <input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv">
      <strong>اضغط لاختيار ملف أو اسحبه هنا</strong>
      <span>xlsx / xls / csv</span>
    </label>
    <div class="file" id="fileInfo"></div>
    <button id="checkBtn" class="full" type="button">فحص</button>

    <div id="result" style="margin-top:16px" aria-live="polite"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
const API_URL = 'https://script.google.com/macros/s/AKfycbzfbcrBUqJULuQkvgCb_cwc8-VvZl8TyK_ZoFe0MNyN3ZlmOO4QpJEk0_Ly84I7UXUXSQ/exec';
const REQUIRED = ['Code', 'Color', 'Qty'];
const TIMEOUT_MS = 90000;
const $ = id => document.getElementById(id);
const norm = v => String(v == null ? '' : v).trim().toLowerCase();
const txt = v => String(v == null ? '' : v).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let password = '', current = null, busy = false;

function callServer(action, args) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, args }),
    signal: ctl.signal
  }).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .finally(() => clearTimeout(t));
}

/* ---------- الدخول ---------- */
$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  if (busy) return;
  const value = $('pw').value;
  if (!value.trim()) return;
  busy = true;
  $('loginBtn').disabled = true;
  $('loginBtn').textContent = 'جارٍ التحقق...';
  $('loginMsg').className = 'message hidden';
  callServer('checkerAuth', [value]).then(res => {
    if (res && res.ok) {
      password = value;
      $('pw').value = '';
      $('loginCard').classList.add('hidden');
      $('appCard').classList.remove('hidden');
    } else {
      showLoginError((res && res.message) || 'كلمة السر غير صحيحة.');
    }
  }).catch(() => showLoginError('تعذر الاتصال بالخادم. حاول مرة أخرى.'))
    .finally(() => { busy = false; $('loginBtn').disabled = false; $('loginBtn').textContent = 'دخول'; });
});
function showLoginError(m) {
  $('loginMsg').className = 'message error';
  $('loginMsg').textContent = m;
}

/* ---------- القالب + الملف ---------- */
$('tplBtn').addEventListener('click', () => {
  const ws = XLSX.utils.aoa_to_sheet([REQUIRED]);
  ws['!cols'] = REQUIRED.map(() => ({ wch: 18 }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
  XLSX.writeFile(wb, 'template.xlsx');
});

function setFile(f) {
  if (!f) return;
  current = f;
  $('fileInfo').textContent = f.name;
  $('fileInfo').classList.add('show');
  $('checkBtn').classList.add('show');
  $('result').innerHTML = '';
}
$('file').addEventListener('change', e => setFile(e.target.files[0]));
const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

/* ---------- أدوات العرض ---------- */
function groupDup(recs, keyFn) {
  const m = new Map();
  recs.forEach(r => { const k = keyFn(r); if (!m.has(k)) m.set(k, []); m.get(k).push(r); });
  return [...m.values()].filter(g => g.length > 1);
}
const rowsText = rows => rows.join(' ، ');
const kv = (k, v) => `<span class="kv"><b>${k}:</b> ${esc(v)}</span>`;
function box(type, title, body) {
  return `<div class="message ${type}"><h3>${title}</h3>${body || ''}</div>`;
}

/* ---------- الفحص ---------- */
$('checkBtn').addEventListener('click', async () => {
  if (busy || !current) return;
  busy = true;
  $('checkBtn').disabled = true;
  const out = $('result');
  out.innerHTML = box('info', 'جارٍ فحص الملف...');

  try {
    const wb = XLSX.read(await current.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: true });
    const headers = (data[0] || []).map(norm);
    const idx = {}, missingCols = [];
    REQUIRED.forEach(c => { const i = headers.indexOf(c.toLowerCase()); i < 0 ? missingCols.push(c) : idx[c] = i; });

    if (missingCols.length) {
      out.innerHTML = box('error', 'أعمدة ناقصة', '<ul>' + missingCols.map(c => `<li>عمود <b dir="ltr">${c}</b> ناقص</li>`).join('') + '</ul>');
      return;
    }

    const recs = [];
    for (let r = 1; r < data.length; r++) {
      const code = txt(data[r][idx.Code]), color = txt(data[r][idx.Color]), qty = txt(data[r][idx.Qty]);
      if (!code && !color && !qty) continue;
      recs.push({ row: r + 1, code, color, qty });
    }

    let html = box('success', 'الأعمدة الثلاثة موجودة', `<p>تم فحص ${recs.length} صف.</p>`);
    let alerts = 0;

    // 1) تكرار Code + Color + Qty
    const full = groupDup(recs, r => [norm(r.code), norm(r.color), norm(r.qty)].join('\u0001'));
    if (full.length) {
      alerts++;
      html += box('warn', 'تنبيه: يوجد تكرار في اللون والكود والكمية',
        full.map(g => `<div class="grp"><div class="h">يوجد تكرار في الصفوف: ${rowsText(g.map(x => x.row))}</div>
          ${kv('Code', g[0].code)} &nbsp; ${kv('Color', g[0].color)} &nbsp; ${kv('Qty', g[0].qty)}</div>`).join(''));
    }

    // 2) تكرار Code + Color
    const pair = groupDup(recs, r => [norm(r.code), norm(r.color)].join('\u0001'));
    if (pair.length) {
      alerts++;
      html += box('warn', 'تنبيه: يوجد تكرار في اللون والكود',
        pair.map(g => `<div class="grp"><div class="h">يوجد تكرار في الصفوف: ${rowsText(g.map(x => x.row))}</div>
          ${kv('Code', g[0].code)} &nbsp; ${kv('Color', g[0].color)}
          <div class="sub">Qty: ${esc(g.map(x => x.qty || '—').join(' / '))}</div></div>`).join(''));
    }

    // 3) المقارنة مع السيستم
    const uniq = new Map(), skipped = [];
    recs.forEach(r => {
      if (!r.code || !r.color) { skipped.push(r.row); return; }
      const k = norm(r.code) + '\u0001' + norm(r.color);
      if (!uniq.has(k)) uniq.set(k, { code: r.code, color: r.color, rows: [] });
      uniq.get(k).rows.push(r.row);
    });
    const list = [...uniq.values()];

    if (list.length) {
      out.innerHTML = html + box('info', 'جارٍ مقارنة الأكواد والألوان مع السيستم...');
      try {
        const res = await callServer('checkerCompare', [password, list.map(u => [u.code, u.color])]);
        if (!res || res.ok !== true) throw new Error((res && res.message) || 'رفض الخادم الطلب.');

        if (res.missing.length) {
          alerts++;
          html += box('warn', `تنبيه: ${res.missing.length} من الألوان غير موجودة على السيستم`,
            `<div class="list">` + res.missing.map(m => {
              const u = list[m.i];
              const rows = `<div class="sub">الصفوف: ${rowsText(u.rows)}</div>`;
              return m.reason === 'CODE_NOT_FOUND'
                ? `<div class="grp"><div class="h">الكود ${esc(u.code)} غير موجود على السيستم</div>${kv('Color', u.color)}${rows}</div>`
                : `<div class="grp"><div class="h">اللون ${esc(u.color)} موجود في الملف المرفوع وليس موجود على السيستم</div>
                    ${kv('Code', u.code)}${rows}<div class="sub">الألوان الموجودة على السيستم: ${esc((m.known || []).join(' ، '))}</div></div>`;
            }).join('') + `</div>`);
        } else {
          html += box('success', 'كل الألوان موجودة على السيستم', `<p>تمت المقارنة مع ${res.warehouses} مخزن.</p>`);
        }
      } catch (err) {
        alerts++;
        if (/كلمة السر/.test(err.message)) {
          html += box('error', 'تعذرت المقارنة مع السيستم', '<p>كلمة السر لم تعد صالحة. أعد تحميل الصفحة وسجّل الدخول.</p>');
        } else {
          html += box('error', 'تعذرت المقارنة مع السيستم', `<p>${esc(err.message || 'خطأ في الاتصال')}</p>`);
        }
      }
    }

    if (skipped.length) {
      html += box('info', 'صفوف لم تدخل المقارنة مع السيستم', `<p>الصفوف التي ينقصها Code أو Color: ${rowsText(skipped)}</p>`);
    }
    if (alerts === 0) html += box('success', 'لا يوجد أي تنبيهات');
    out.innerHTML = html;
  } catch (e) {
    out.innerHTML = box('error', 'تعذر قراءة الملف', '<p>تأكد أن الملف بصيغة إكسل أو CSV سليمة.</p>');
  } finally {
    busy = false;
    $('checkBtn').disabled = false;
  }
});
</script>
</body>
</html>
